name: Linux-Master-CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Prepare vcpkg cache
      id: vcpkg-cache
      shell: bash
      run: |
        mkdir -p .vcpkg-binary-cache
        echo "revision=$(git -C ThirdParty/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: .vcpkg-binary-cache
        key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-x64-linux-v1-${{ steps.vcpkg-cache.outputs.revision }}-${{ steps.vcpkg-cache.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ThirdParty/vcpkg_triplets/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-x64-linux-v1-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev mesa-utils libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
        ./ThirdParty/vcpkg/bootstrap-vcpkg.sh
        
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_TESTS=ON -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_OVERLAY_TRIPLETS="${{github.workspace}}/ThirdParty/vcpkg_triplets" -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}/ThirdParty/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel
      
    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}  -VV
