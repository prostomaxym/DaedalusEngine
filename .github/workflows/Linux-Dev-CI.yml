name: Linux-Dev-CI

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

env:
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'

permissions:
  contents: read

jobs:
  build:
    name: Linux (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Release
            build_type: Release
            sanitizers: 'OFF'
          - label: ASan-UBSan
            build_type: ReleaseDevTools
            sanitizers: 'ON'
    env:
      BUILD_TYPE: ${{ matrix.build_type }}

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Prepare vcpkg cache
      id: vcpkg-cache
      shell: bash
      run: |
        mkdir -p .vcpkg-binary-cache
        echo "revision=$(git -C ThirdParty/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: .vcpkg-binary-cache
        key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-x64-linux-v1-${{ steps.vcpkg-cache.outputs.revision }}-${{ steps.vcpkg-cache.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ThirdParty/vcpkg_triplets/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-x64-linux-v1-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config autoconf autoconf-archive automake libtool libltdl-dev libgl1-mesa-dev mesa-utils libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
        ./ThirdParty/vcpkg/bootstrap-vcpkg.sh
        
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DENABLE_TESTS=ON -DENABLE_SANITIZERS=${{ matrix.sanitizers }} -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_OVERLAY_TRIPLETS="${{github.workspace}}/ThirdParty/vcpkg_triplets" -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}/ThirdParty/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 2
      
    - name: Test
      working-directory: ${{github.workspace}}/build
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Upload CTest diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-ctest-${{ matrix.label }}
        path: build/Testing/Temporary/*.log
        if-no-files-found: ignore
