name: Windows-Release

on:
  workflow_dispatch

env:
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite'

jobs:

  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Prepare vcpkg cache
      id: vcpkg-cache
      shell: bash
      run: |
        mkdir -p .vcpkg-binary-cache
        echo "revision=$(git -C ThirdParty/vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: .vcpkg-binary-cache
        key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-x64-windows-v1-${{ steps.vcpkg-cache.outputs.revision }}-${{ steps.vcpkg-cache.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ThirdParty/vcpkg_triplets/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-x64-windows-v1-

    - name: Bootstrap vcpkg
      run: .\ThirdParty\vcpkg\bootstrap-vcpkg.bat

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_OVERLAY_TRIPLETS="${{github.workspace}}/ThirdParty/vcpkg_triplets" -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}/ThirdParty/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel
      
    - name: Install
      run: cmake --install ${{github.workspace}}/build --prefix ${{github.workspace}}/install

    - name: Pack Installer
      id: package
      shell: pwsh
      run: |
        $VersionNumber = & ./WinScripts/GetVersionNumber.ps1
        if ($VersionNumber -notmatch '^\d+\.\d+\.\d+$') {
          throw "Invalid project version: $VersionNumber"
        }
        $ProductName = "Daedalus Development Sandbox-" + $VersionNumber + "-win64"
        $ProductPath = "${{github.workspace}}/install/" + $ProductName + ".exe"
        Write-Host "ProductName: $ProductName"
        Write-Host "ProductPath: $ProductPath"
        Write-Host "VersionNumber: $VersionNumber"
        "version=$VersionNumber" >> $env:GITHUB_OUTPUT
        "asset-name=$ProductName.exe" >> $env:GITHUB_OUTPUT
        "file=$ProductPath" >> $env:GITHUB_OUTPUT

        cd build
        cpack

    - uses: djnicholson/release-action@v2.11
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        release-name: "Daedalus Development Sandbox"
        tag-name: 'v${{ steps.package.outputs.version }}'
        asset-name: '${{ steps.package.outputs.asset-name }}'
        file: '${{ steps.package.outputs.file }}'
